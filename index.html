<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>The Proposal</title>
<style>
  :root{
    --ink:#26324A;
    --navy:#1C2B45;
    --sky-a:#E4ECF3;
    --sky-b:#F5F1E8;
    --blue:#5C7FA3;
    --blue-deep:#3E5876;
    --lilac:#8B96C9;
    --gold:#D8AE5C;
    --cream:#FBF8F2;
    --line:#C9D3DE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden; touch-action:manipulation;}
  body{
    font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
    background:var(--navy);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    position:relative; width:100%; height:100%; max-width:560px;
    background:linear-gradient(180deg,var(--sky-a),var(--sky-b));
    overflow:hidden;
  }
  #app::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.3;
    background-image:
      radial-gradient(circle at 18% 22%, var(--lilac) 0 3px, transparent 4px),
      radial-gradient(circle at 82% 15%, var(--blue) 0 2.5px, transparent 3.5px),
      radial-gradient(circle at 65% 40%, var(--lilac) 0 2px, transparent 3px),
      radial-gradient(circle at 30% 60%, var(--blue) 0 2px, transparent 3px),
      radial-gradient(circle at 90% 70%, var(--lilac) 0 2.5px, transparent 3.5px);
  }
  canvas{display:block; position:absolute; inset:0; width:100%; height:100%; touch-action:manipulation;}

  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:32px 28px; z-index:8;
  }
  .hidden{display:none !important;}

  .eyebrow{
    font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--blue-deep); font-weight:700; margin-bottom:10px; opacity:.75;
  }
  h1{
    font-size:clamp(30px,8vw,42px); font-weight:800; letter-spacing:-.01em;
    margin:0 0 12px; color:var(--navy); line-height:1.08;
  }
  p.sub{
    font-size:16px; color:var(--blue-deep); max-width:320px; line-height:1.5;
    margin:0 0 28px; font-weight:500;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--navy); color:var(--cream);
    font-family:inherit; font-weight:700; font-size:16px;
    padding:15px 30px; border-radius:999px; letter-spacing:.01em;
    box-shadow:0 8px 20px rgba(28,43,69,.25);
    transition:transform .15s ease;
  }
  .btn:active{transform:scale(.96);}

  #hud{
    position:absolute; top:16px; left:16px; z-index:6;
    background:rgba(251,248,242,.85); backdrop-filter:blur(4px);
    border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; font-weight:700; font-size:14px; color:var(--navy);
    display:flex; align-items:center; gap:6px;
  }
  #hearts{
    position:absolute; top:16px; right:16px; z-index:6;
    background:rgba(251,248,242,.85); backdrop-filter:blur(4px);
    border:1px solid var(--line); border-radius:999px;
    padding:8px 12px; font-size:16px; letter-spacing:2px;
  }
  #jumpBtn{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    z-index:6; width:140px; height:52px; border-radius:999px;
    background:var(--blue-deep); color:var(--cream); border:none;
    font-family:inherit; font-weight:800; font-size:14px; letter-spacing:.08em;
    box-shadow:0 8px 18px rgba(28,43,69,.3);
    touch-action:manipulation; user-select:none;
  }
  #jumpBtn:active{transform:translateX(-50%) scale(.94);}

  #card{
    position:absolute; inset:0; z-index:7; display:flex;
    align-items:center; justify-content:center; padding:28px;
    background:rgba(28,43,69,.32); backdrop-filter:blur(2px);
  }
  .cardbox{
    background:var(--cream); border-radius:20px; padding:26px 24px;
    max-width:330px; text-align:center; box-shadow:0 20px 40px rgba(28,43,69,.3);
    border:1px solid var(--line);
  }
  .cardbox .date{
    font-weight:800; font-size:13px; color:var(--blue-deep);
    letter-spacing:.06em; text-transform:uppercase; margin-bottom:8px;
  }
  .cardbox .txt{font-size:18px; font-weight:600; color:var(--navy); line-height:1.45; margin-bottom:18px;}
  .cardbox.reflection{background:#EEF2F8; border-color:var(--lilac);}
  .cardbox.reflection .txt{font-style:italic; color:var(--blue-deep);}
  .cardbox .btn{padding:11px 24px; font-size:14px;}

  #gameover .cardbox{background:var(--navy); border-color:var(--blue-deep);}
  #gameover .txt{color:var(--cream);}
  #gameover .sub2{color:#B9C6D8; font-size:14px; margin-bottom:18px;}

  #finaleUnderline{
    position:absolute; left:0; right:0; bottom:11%; z-index:6;
    text-align:center; opacity:0; transition:opacity 1.2s ease;
    font-size:16px; color:#DCE6F0; font-weight:600; letter-spacing:.02em; padding:0 20px;
  }
  #finaleUnderline.show{opacity:1;}

  /* ---- retro 8-bit start screen ---- */
  #startScreen{
    background:radial-gradient(ellipse at 50% 35%, #234158 0%, #0F1B2C 78%);
  }
  #startScreen::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0px, rgba(0,0,0,.18) 1px, transparent 1px, transparent 3px);
  }
  .pixel-frame{
    position:relative; z-index:2;
    background:#152838;
    border:4px solid var(--gold);
    box-shadow:6px 6px 0 rgba(0,0,0,.55);
    padding:30px 24px 26px;
    clip-path:polygon(0 10px,10px 10px,10px 0,calc(100% - 10px) 0,calc(100% - 10px) 10px,100% 10px,100% calc(100% - 10px),calc(100% - 10px) calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,10px calc(100% - 10px),0 calc(100% - 10px));
    max-width:300px;
    display:flex; flex-direction:column; align-items:center;
  }
  .pixel-heart-wrap{ position:relative; width:28px; height:24px; margin-bottom:16px; }
  .pixel-heart{
    width:4px; height:4px; position:absolute; top:0; left:0; background:transparent;
    box-shadow:
    4px 0px 0 var(--gold),
    12px 0px 0 var(--gold),
    20px 0px 0 var(--gold),
    0px 4px 0 var(--gold),
    4px 4px 0 var(--gold),
    8px 4px 0 var(--gold),
    12px 4px 0 var(--gold),
    16px 4px 0 var(--gold),
    20px 4px 0 var(--gold),
    24px 4px 0 var(--gold),
    0px 8px 0 var(--gold),
    4px 8px 0 var(--gold),
    8px 8px 0 var(--gold),
    12px 8px 0 var(--gold),
    16px 8px 0 var(--gold),
    20px 8px 0 var(--gold),
    24px 8px 0 var(--gold),
    4px 12px 0 var(--gold),
    8px 12px 0 var(--gold),
    12px 12px 0 var(--gold),
    16px 12px 0 var(--gold),
    20px 12px 0 var(--gold),
    8px 16px 0 var(--gold),
    12px 16px 0 var(--gold),
    16px 16px 0 var(--gold),
    12px 20px 0 var(--gold);
  }
  .retro-eyebrow{
    font-family:'Courier New', ui-monospace, monospace; color:#8FB0CC;
    font-size:10px; letter-spacing:.3em; text-transform:uppercase; margin-bottom:14px;
  }
  .retro-title{
    font-family:'Courier New', ui-monospace, monospace;
    font-weight:900; text-transform:uppercase; letter-spacing:2px;
    color:#F3D9A4; text-align:center;
    text-shadow:3px 0 0 #3E5876, 0 3px 0 #3E5876, 3px 3px 0 #3E5876, -3px 0 0 #3E5876, 0 -3px 0 #3E5876, -3px -3px 0 #3E5876, -3px 3px 0 #3E5876, 3px -3px 0 #3E5876;
    font-size:clamp(22px,7vw,30px); line-height:1.35; margin:0 0 14px;
  }
  .retro-sub{
    font-family:'Courier New', ui-monospace, monospace; color:#AFC4DA;
    font-size:12px; line-height:1.8; letter-spacing:.3px; max-width:250px; margin:0 0 24px;
  }
  .btn-retro{
    appearance:none; cursor:pointer; font-family:'Courier New', ui-monospace, monospace;
    font-weight:900; text-transform:uppercase; letter-spacing:2px; font-size:15px;
    background:var(--gold); color:#1C2B45; border:3px solid #1C2B45;
    padding:13px 26px; box-shadow:5px 5px 0 #0A1420;
    animation:retro-blink 1.3s steps(1,end) infinite;
    transition:none;
  }
  .btn-retro:active{ transform:translate(5px,5px); box-shadow:0 0 0 #0A1420; }
  @keyframes retro-blink{ 0%,55%{opacity:1;} 56%,100%{opacity:.78;} }
</style>
</head>
<body>
<div id="app">

  <canvas id="game"></canvas>

  <div id="hud" class="hidden">🍕 <span id="coinCount">0</span></div>
  <div id="hearts" class="hidden"></div>
  <button id="jumpBtn" class="hidden">PULAR</button>

  <div id="startScreen" class="screen">
    <div class="pixel-frame">
      <div class="pixel-heart-wrap"><div class="pixel-heart"></div></div>
      <div class="retro-eyebrow">um joguinho</div>
      <div class="retro-title">The<br/>Proposal</div>
      <p class="retro-sub">Toque em PULAR pra recolher uns lanchinhos e desviar dos obstáculos. Você tem 3 vidas. No final tem uma surpresa.</p>
      <button class="btn-retro" id="startBtn">▶ Começar</button>
    </div>
  </div>

  <div id="card" class="hidden">
    <div class="cardbox" id="cardBox">
      <div class="date" id="cpDate"></div>
      <div class="txt" id="cpText"></div>
      <button class="btn" id="cpBtn">Continuar →</button>
    </div>
  </div>

  <div id="gameover" class="screen hidden">
    <div class="cardbox">
      <div class="txt">Ihh, essa foi por pouco! 💔</div>
      <div class="sub2">Mas o nosso amor sempre tem revanche.</div>
      <button class="btn" id="continueBtn" style="margin-bottom:10px;">Continuar de onde parei</button>
      <button class="btn" id="retryBtn" style="background:transparent; color:var(--cream); box-shadow:none; border:2px solid var(--blue-deep);">Jogar do início</button>
    </div>
  </div>

  <div id="finaleUnderline">ei... olha pra mim? 👀💙</div>

</div>

<script>
(function(){
  const app = document.getElementById('app');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const coinCountEl = document.getElementById('coinCount');
  const heartsEl = document.getElementById('hearts');
  const jumpBtn = document.getElementById('jumpBtn');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');
  const cardWrap = document.getElementById('card');
  const cardBox = document.getElementById('cardBox');
  const cpDate = document.getElementById('cpDate');
  const cpText = document.getElementById('cpText');
  const cpBtn = document.getElementById('cpBtn');
  const gameoverScreen = document.getElementById('gameover');
  const retryBtn = document.getElementById('retryBtn');
  const continueBtn = document.getElementById('continueBtn');
  const finaleUnderline = document.getElementById('finaleUnderline');

  let W=0,H=0,DPR=1;
  function resize(){
    const rect = app.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = rect.width; H = rect.height;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const GROUND_Y = () => H*0.72;
  const SPEED = 135;
  const GRAVITY = 2000;
  const JUMP_V = -680;

  const milestones = [
    {dist: 700,  type:'date', date:'Maio de 2015',         text:'A gente se conheceu.'},
    {dist: 1450, type:'date', date:'Junho de 2015',         text:'Começamos a namorar.'},
    {dist: 2200, type:'date', date:'Segundo semestre de 2015', text:'Fomos morar juntos.'},
    {dist: 2950, type:'reflection', text:'Durante esses anos, tivemos os nossos desafios...'},
    {dist: 3700, type:'reflection', text:'...mas vivemos momentos lindos juntos. 💙'},
    {dist: 4450, type:'reflection', text:'Desde o começo, você abraçou meu filho mais velho como seu — cuidando dos estudos, da saúde, de cada detalhe. Pra mim, você sempre foi mãe dele também. 🏀💙'},
    {dist: 5200, type:'date', date:'Dezembro de 2023',      text:'Nossa família ganhou mais um menino.'},
    {dist: 5950, type:'date', date:'Março de 2026',         text:'Nossa família cresceu de novo.'},
    {dist: 6700, type:'reflection', text:'Você nunca soltou a mão de nenhum dos nossos três filhos.'},
    {dist: 7450, type:'reflection', text:'E cada dia, vendo você com eles, eu sei o quanto fui abençoado por ter você na minha vida.'},
    {dist: 8200, type:'reflection', text:'Sei que Deus ainda tem muitas bênçãos nos aguardando...'},
    {dist: 8950, type:'reflection', text:'Mas em todas elas desejo estar ao seu lado!! 💙'},
  ];
  const TOTAL_DIST = 9800;
  const momentos = ['🍨', '🫐','🍔', '🍟','🍕','🎬','🍿', '🎥', '🏀'];

  let state = 'idle';
  let scrollDist=0, lastTime=0;
  let player = {x:0,y:0,vy:0,onGround:true,r:16,phase:0};
  let coins=[], obstacles=[], hearts=[];
  let nextCoinAt=0, nextObstacleAt=0, nextHeartCheck=0, nextCheckpointIdx=0;
  let coinsCollected=0, lives=3, invuln=0;
  let clouds=[], bushes=[];
  let obstaclesEnabled=false;
  let jumpBuffer=0, coyoteTime=0;
  let respawnDist=0, respawnCheckpointIdx=0, respawnObstaclesEnabled=false;
  let lastCollectibleX=-99999, lastObstacleX=-99999;
  const COLLECTIBLE_GAP = 150;      // min distance between any two coins/hearts
  const OBSTACLE_COLLECTIBLE_GAP = 260; // min distance keeping items away from obstacles

  function renderHearts(){
    let s='';
    for(let i=0;i<3;i++) s += i<lives ? '❤️' : '🤍';
    heartsEl.textContent = s;
  }

  function initWorld(){
    scrollDist=0; coinsCollected=0; lives=3; invuln=0;
    coinCountEl.textContent='0'; renderHearts();
    nextCoinAt=350; nextObstacleAt=2900; nextHeartCheck=1200; nextCheckpointIdx=0;
    obstaclesEnabled=false; jumpBuffer=0; coyoteTime=0;
    lastCollectibleX=-99999; lastObstacleX=-99999;
    respawnDist=0; respawnCheckpointIdx=0; respawnObstaclesEnabled=false;
    coins=[]; obstacles=[]; hearts=[];
    player={x:W*0.26,y:GROUND_Y()-16,vy:0,onGround:true,r:16,phase:0};
    clouds=Array.from({length:5},()=>({x:Math.random()*1000,y:40+Math.random()*80,s:0.6+Math.random()*0.8}));
    bushes=Array.from({length:10},(_,i)=>({x:i*260+Math.random()*80,s:0.7+Math.random()*0.6}));
  }

  function resumeFromCheckpoint(){
    scrollDist=respawnDist; lives=3; invuln=1.2; jumpBuffer=0; coyoteTime=0;
    lastCollectibleX=-99999; lastObstacleX=-99999;
    nextCoinAt=scrollDist+300; nextObstacleAt=scrollDist+1400; nextHeartCheck=scrollDist+1000;
    nextCheckpointIdx=respawnCheckpointIdx;
    obstaclesEnabled=respawnObstaclesEnabled;
    coins=[]; obstacles=[]; hearts=[];
    renderHearts();
    player={x:W*0.26,y:GROUND_Y()-16,vy:0,onGround:true,r:16,phase:0};
  }

  function jump(){
    if(state!=='playing') return;
    if(player.onGround || coyoteTime>0){
      player.vy=JUMP_V; player.onGround=false; coyoteTime=0; jumpBuffer=0;
    } else {
      jumpBuffer=0.15; // remember the tap for a moment in case landing is a beat away
    }
  }
  jumpBtn.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
  jumpBtn.addEventListener('mousedown',jump);
  window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});
  canvas.addEventListener('touchstart',()=>{ if(state==='playing') jump(); },{passive:true});

  startBtn.addEventListener('click',()=>{
    startScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    heartsEl.classList.remove('hidden');
    jumpBtn.classList.remove('hidden');
    initWorld(); state='playing'; lastTime=performance.now();
    requestAnimationFrame(loop);
  });

  retryBtn.addEventListener('click',()=>{
    gameoverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    heartsEl.classList.remove('hidden');
    jumpBtn.classList.remove('hidden');
    initWorld(); state='playing'; lastTime=performance.now();
  });

  continueBtn.addEventListener('click',()=>{
    gameoverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    heartsEl.classList.remove('hidden');
    jumpBtn.classList.remove('hidden');
    resumeFromCheckpoint(); state='playing'; lastTime=performance.now();
  });

  cpBtn.addEventListener('click',()=>{
    cardWrap.classList.add('hidden');
    state='playing'; lastTime=performance.now();
  });

  function spawnCoin(){
    const x=scrollDist+W+40;
    if(Math.abs(x-lastCollectibleX)<COLLECTIBLE_GAP || Math.abs(x-lastObstacleX)<OBSTACLE_COLLECTIBLE_GAP){
      nextCoinAt=scrollDist+180; return; // too close, try again shortly
    }
    const emoji=momentos[Math.floor(Math.random()*momentos.length)];
    const y=GROUND_Y()-60-Math.random()*90;
    coins.push({worldX:x,y,emoji,collected:false,floatT:0});
    lastCollectibleX=x;
    nextCoinAt=scrollDist+W*0.6+Math.random()*170;
  }
  function spawnObstacle(){
    const x=scrollDist+W+40;
    if(Math.abs(x-lastCollectibleX)<OBSTACLE_COLLECTIBLE_GAP){
      nextObstacleAt=scrollDist+180; return; // too close to a collectible, try again shortly
    }
    obstacles.push({worldX:x, hit:false});
    lastObstacleX=x;
    nextObstacleAt=scrollDist+W*1.05+Math.random()*280;
  }
  function checkHeartSpawn(){
    if(scrollDist<nextHeartCheck) return;
    if(lives<3){
      const x=scrollDist+W+40;
      if(Math.abs(x-lastCollectibleX)<COLLECTIBLE_GAP || Math.abs(x-lastObstacleX)<OBSTACLE_COLLECTIBLE_GAP){
        nextHeartCheck=scrollDist+180; return; // too close, try again shortly
      }
      const y=GROUND_Y()-70-Math.random()*70;
      hearts.push({worldX:x,y,collected:false,floatT:0});
      lastCollectibleX=x;
      nextHeartCheck=scrollDist+2200+Math.random()*700;
    } else {
      nextHeartCheck=scrollDist+400; // full hearts: just check again soon, don't spawn
    }
  }

  function gameOver(){
    state='gameover';
    hud.classList.add('hidden'); heartsEl.classList.add('hidden'); jumpBtn.classList.add('hidden');
    gameoverScreen.classList.remove('hidden');
  }

  function update(dt){
    if(state!=='playing') return;
    scrollDist += SPEED*dt;
    if(invuln>0) invuln-=dt;

    const wasOnGround = player.onGround;
    player.vy += GRAVITY*dt;
    player.y += player.vy*dt;
    const gy=GROUND_Y()-player.r;
    if(player.y>=gy){ player.y=gy; player.vy=0; player.onGround=true; }
    player.phase += dt*6;

    // coyote time: stay "jumpable" for a beat right after leaving the ground
    if(wasOnGround && !player.onGround) coyoteTime=0.1;
    else if(coyoteTime>0) coyoteTime=Math.max(0,coyoteTime-dt);

    // jump buffer: a tap that landed a moment early still fires the instant we touch ground
    if(jumpBuffer>0){
      jumpBuffer=Math.max(0,jumpBuffer-dt);
      if(player.onGround){ player.vy=JUMP_V; player.onGround=false; jumpBuffer=0; coyoteTime=0; }
    }

    if(obstaclesEnabled && scrollDist>=nextObstacleAt) spawnObstacle();
    if(scrollDist>=nextCoinAt) spawnCoin();
    checkHeartSpawn();

    for(const c of coins){
      if(c.collected) continue;
      const sx=c.worldX-scrollDist, dx=sx-player.x, dy=c.y-player.y;
      if(Math.hypot(dx,dy)<player.r+16){ c.collected=true; c.floatT=0.0001; coinsCollected++; coinCountEl.textContent=coinsCollected; }
    }
    coins=coins.filter(c=>(c.worldX-scrollDist)>-80);

    for(const h of hearts){
      if(h.collected) continue;
      const sx=h.worldX-scrollDist, dx=sx-player.x, dy=h.y-player.y;
      if(Math.hypot(dx,dy)<player.r+16){
        h.collected=true; h.floatT=0.0001;
        if(lives<3){ lives++; renderHearts(); }
      }
    }
    hearts=hearts.filter(h=>(h.worldX-scrollDist)>-80);

    for(const o of obstacles){
      if(o.hit) continue;
      const sx=o.worldX-scrollDist;
      const ow=26, oh=34;
      const px=player.x, py=player.y;
      const closestX=Math.max(sx-ow/2,Math.min(px,sx+ow/2));
      const topY=GROUND_Y()+player.r - oh;
      const closestY=Math.max(topY,Math.min(py,GROUND_Y()+player.r));
      if(Math.hypot(px-closestX,py-closestY)<player.r-5 && invuln<=0){
        o.hit=true; lives--; invuln=1.1; renderHearts();
        if(lives<=0){ gameOver(); return; }
      }
    }
    obstacles=obstacles.filter(o=>(o.worldX-scrollDist)>-60);

    if(nextCheckpointIdx<milestones.length && scrollDist>=milestones[nextCheckpointIdx].dist){
      const m=milestones[nextCheckpointIdx]; nextCheckpointIdx++;
      if(m.type==='reflection' && m.text.indexOf('desafios')>=0) obstaclesEnabled=true;
      respawnDist=milestones[nextCheckpointIdx-1].dist;
      respawnCheckpointIdx=nextCheckpointIdx;
      respawnObstaclesEnabled=obstaclesEnabled;
      if(m.type==='date'){
        cardBox.classList.remove('reflection');
        cpDate.style.display='block'; cpDate.textContent=m.date; cpText.textContent=m.text;
      } else {
        cardBox.classList.add('reflection');
        cpDate.style.display='none'; cpText.textContent=m.text;
      }
      cardWrap.classList.remove('hidden');
      state='paused_checkpoint';
      return;
    }

    if(scrollDist>=TOTAL_DIST){ scrollDist=TOTAL_DIST; startCredits(); }
  }

  function drawCloud(x,y,s){
    ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.ellipse(x,y,22*s,12*s,0,0,Math.PI*2);
    ctx.ellipse(x+18*s,y+4*s,16*s,10*s,0,0,Math.PI*2);
    ctx.ellipse(x-16*s,y+5*s,14*s,9*s,0,0,Math.PI*2);
    ctx.fill();
  }
  function drawBush(x,gy,s){
    ctx.fillStyle='#AAB9CC'; ctx.globalAlpha=.55;
    ctx.beginPath(); ctx.ellipse(x,gy-6*s,16*s,12*s,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  function drawObstacle(x,gy){
    ctx.fillStyle='#6B7A90';
    const w=22,h=30;
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(x-w/2, gy-h, w, h, 5); } else { ctx.rect(x-w/2,gy-h,w,h); }
    ctx.fill();
    ctx.fillStyle='#54637A';
    ctx.fillRect(x-w/2, gy-h, w, 6);
  }

  function drawPlaying(){
    ctx.clearRect(0,0,W,H);
    const gy=GROUND_Y();
    for(const c of clouds){
      const sx=((c.x-scrollDist*0.25)%(W+200)+(W+200))%(W+200)-100;
      drawCloud(sx,c.y,c.s);
    }
    ctx.strokeStyle='#C9D3DE'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,gy+player.r+2); ctx.lineTo(W,gy+player.r+2); ctx.stroke();
    for(const b of bushes){
      const sx=((b.x-scrollDist)%(W+300)+(W+300))%(W+300)-150;
      drawBush(sx,gy+player.r+2,b.s);
    }
    for(const o of obstacles){ if(!o.hit) drawObstacle(o.worldX-scrollDist, gy+player.r+2); }

    ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    for(const c of coins){
      const sx=c.worldX-scrollDist;
      if(c.collected){ c.floatT+=0.045; if(c.floatT>1) continue; ctx.globalAlpha=1-c.floatT; ctx.fillText(c.emoji,sx,c.y-c.floatT*40); ctx.globalAlpha=1; }
      else { const bob=Math.sin((scrollDist+sx)*0.02)*4; ctx.fillText(c.emoji,sx,c.y+bob); }
    }
    for(const h of hearts){
      const sx=h.worldX-scrollDist;
      if(h.collected){ h.floatT+=0.045; if(h.floatT>1) continue; ctx.globalAlpha=1-h.floatT; ctx.fillText('❤️',sx,h.y-h.floatT*40); ctx.globalAlpha=1; }
      else {
        const pulse=1+Math.sin((scrollDist+sx)*0.05)*0.12;
        const bob=Math.sin((scrollDist+sx)*0.02)*5;
        ctx.save(); ctx.translate(sx,h.y+bob); ctx.scale(pulse,pulse);
        ctx.fillText('❤️',0,0);
        ctx.restore();
      }
    }

    const blink = invuln>0 && Math.floor(invuln*12)%2===0;
    if(!blink){
      const bob=player.onGround?Math.sin(player.phase)*1.5:0;
      const px=player.x, py=player.y+bob;
      ctx.save(); ctx.translate(px,py);
      ctx.fillStyle='#5C7FA3'; ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FBF8F2'; ctx.beginPath(); ctx.arc(-5,-2,3,0,Math.PI*2); ctx.arc(5,-2,3,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#26324A'; ctx.beginPath(); ctx.arc(-5,-2,1.4,0,Math.PI*2); ctx.arc(5,-2,1.4,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#26324A'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(0,3,5,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
      ctx.restore();
    }
  }

  const creditLines = [
    {t:'The Proposal', big:true},
    {t:''},
    {t:'Você é muito especial para mim.'},
    {t:''},
    {t:'Tudo que sou e tudo que me tornei,'},
    {t:'devo a Deus por ter colocado'},
    {t:'você ao meu lado.'},
    {t:''},
    {t:''},
    {t:'Foram anos de desafios,'},
    {t:'mas também de momentos lindos.'},
    {t:''},
    {t:'E eu quero muitos e muitos mais,'},
    {t:'ao seu lado,'},
    {t:'nesta vida e nas próximas,'},
    {t:'se Deus permitir. 🙏'},
    {t:''},
    {t:''},
    {t:''},
  ];
  let creditsStart=0, creditStars=[];

  function startCredits(){
    state='credits';
    hud.classList.add('hidden'); heartsEl.classList.add('hidden'); jumpBtn.classList.add('hidden');
    creditsStart=performance.now();
    creditStars=Array.from({length:45},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+0.3,tw:Math.random()*Math.PI*2}));
  }

  function drawCredits(now){
    const t=(now-creditsStart)/1000;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#101a2c'; ctx.fillRect(0,0,W,H);
    for(const s of creditStars){
      const tw=0.5+0.5*Math.sin(t*2+s.tw);
      ctx.fillStyle=`rgba(255,255,255,${0.5*tw})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const scrollSpeed=42;
    const lineH=38;
    const baseY = H + 40 - t*scrollSpeed;
    let allAbove=true;
    creditLines.forEach((ln,i)=>{
      const y=baseY+i*lineH;
      if(y>-40) allAbove=false;
      if(y<-40||y>H+40) return;
      let a=1;
      if(y<H*0.18) a=Math.max(0,(y)/(H*0.18));
      if(y>H*0.85) a=Math.max(0,(H+40-y)/(H*0.55));
      ctx.globalAlpha=Math.min(1,a);
      if(ln.big){ ctx.font='800 26px -apple-system, "Segoe UI", sans-serif'; ctx.fillStyle='#D8AE5C'; }
      else { ctx.font='600 18px -apple-system, "Segoe UI", sans-serif'; ctx.fillStyle='#E7EEF6'; }
      if(ln.t) ctx.fillText(ln.t, W/2, y);
    });
    ctx.globalAlpha=1;
    if(allAbove && t>2){ startFinale(); }
  }

  const lines = [
    'Um cineminha, uma pizza,',
    'um sorvete, um açaí...',
    'e você, para sempre',
    'ao meu lado.',
    'Aceita casar comigo? 🙏💙'
  ];
  let particles=[], finaleStart=0, finaleStars=[], crispStart=null;
  let textFontSize=20, textStartY=0, textLineH=0;

  function buildTargets(){
    const SCALE=3;
    const off=document.createElement('canvas');
    off.width=W*SCALE; off.height=H*SCALE;
    const octx=off.getContext('2d');
    octx.scale(SCALE,SCALE);
    octx.fillStyle='#fff'; octx.textAlign='center'; octx.textBaseline='middle';
    textFontSize=Math.max(15,Math.min(21,W/18));
    octx.font=`800 ${textFontSize}px -apple-system, "Segoe UI", sans-serif`;
    textStartY=H*0.28; textLineH=textFontSize*1.55;
    lines.forEach((ln,i)=>octx.fillText(ln,W/2,textStartY+i*textLineH));
    const img=octx.getImageData(0,0,W*SCALE,H*SCALE).data;
    const pts=[]; const step=2; const fullW=W*SCALE;
    for(let y=0;y<H*SCALE;y+=step){
      for(let x=0;x<W*SCALE;x+=step){
        if(img[(y*fullW+x)*4+3]>140) pts.push({x:x/SCALE,y:y/SCALE});
      }
    }
    return pts;
  }

  function startFinale(){
    state='finaleTransition';
    finaleStart=performance.now(); crispStart=null;
    const targets=buildTargets();
    finaleStars=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H*0.6,r:Math.random()*1.4+0.4,tw:Math.random()*Math.PI*2}));
    particles=targets.map(t=>({x:Math.random()*W,y:H+Math.random()*120,tx:t.x,ty:t.y,delay:Math.random()*0.55,dur:0.8+Math.random()*0.5}));
  }

  function drawFinale(now){
    const t=(now-finaleStart)/1000;
    const fade=Math.min(1,t/1.1);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#101a2c'; ctx.fillRect(0,0,W,H);
    for(const s of finaleStars){
      const tw=0.5+0.5*Math.sin(t*2+s.tw);
      ctx.fillStyle=`rgba(255,255,255,${0.5*tw})`;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    const allDone=particles.every(p=>(t-p.delay)>=p.dur);
    if(allDone && crispStart===null) crispStart=t;
    const crispAlpha=crispStart===null?0:Math.min(1,(t-crispStart)/0.7);

    ctx.fillStyle='#D8AE5C';
    for(const p of particles){
      let pt=(t-p.delay)/p.dur; pt=Math.max(0,Math.min(1,pt));
      const ease=1-Math.pow(1-pt,3);
      const cx=p.x+(p.tx-p.x)*ease, cy=p.y+(p.ty-p.y)*ease;
      ctx.globalAlpha=(0.4+0.6*ease)*(1-crispAlpha*0.75);
      ctx.beginPath(); ctx.arc(cx,cy,1.6,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    if(crispAlpha>0){
      ctx.save();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font=`800 ${textFontSize}px -apple-system, "Segoe UI", sans-serif`;
      ctx.globalAlpha=crispAlpha;
      ctx.shadowColor='rgba(216,174,92,0.85)'; ctx.shadowBlur=14;
      ctx.fillStyle='#F3D9A4';
      lines.forEach((ln,i)=>ctx.fillText(ln,W/2,textStartY+i*textLineH));
      ctx.restore(); ctx.globalAlpha=1;
    }

    if(state==='finaleTransition'&&fade>=1) state='finaleForm';
    if(state==='finaleForm'&&crispAlpha>=1&&t-crispStart>0.5){ state='finaleDone'; finaleUnderline.classList.add('show'); }
  }

  function loop(now){
    const dt=Math.min(0.035,(now-lastTime)/1000); lastTime=now;
    if(state==='playing'){ update(dt); if(state==='playing'||state==='paused_checkpoint') drawPlaying(); }
    else if(state==='paused_checkpoint'){ drawPlaying(); }
    else if(state==='credits'){ drawCredits(now); }
    else if(state==='finaleTransition'||state==='finaleForm'||state==='finaleDone'){ drawFinale(now); }
    requestAnimationFrame(loop);
  }
})();
</script>
